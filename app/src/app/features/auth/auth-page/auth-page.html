<div class="auth-container">
    <div class="header">
        <button type="button" (click)="showLogin()">Iniciar sesión</button>
        <button type="button" (click)="showRegister()">Registrarse</button>
    </div>
    <div class="body">
        @if(isLogin){
            <app-login></app-login>
        } @else {
            <app-register></app-register>
        }
    </div>
</div>
